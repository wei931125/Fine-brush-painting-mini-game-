<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丹青試煉：工筆畫的時空之旅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bg-music" loop>
    <source src="遊戲音樂1.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    
    <a href="遊戲操作影片1.mp4" target="_blank" id="video-guide-btn" title="觀看操作影片">🎬 觀看教學</a>
    <div id="score-board">當前總分：<span id="current-score">0</span></div>

    <!-- 首頁封面 -->
    <div id="screen-home" class="screen active">
        <img src="封面圖片.png" class="bg-image" alt="丹青試煉封面圖">
        
        <div class="glass-panel small-window">
            
            <h1 class="ancient-title title-fade-in">丹青試煉<br><span style="font-size: 1.8rem;">工筆畫的時空之旅</span></h1>
            
            <div class="intro-text-container">
                <div class="fade-step-1 ancient-text">
                    <span class="highlight-title">【 遊戲概述 】</span><br>
                    時長：5至10分鐘<br>
                    關卡：劇情選擇 / 物品配對 / 節奏點擊
                </div>
                
                <div class="fade-step-2 ancient-text" style="font-weight: bold; color: #5c3a21;">
                    準備好穿越時空，體驗工筆畫的雋永魅力了嗎？
                </div>
            </div>
            
            <div class="fade-step-3" style="text-align: center; margin-top: 15px;">
                <button class="start-btn-premium" onclick="startGame()">開始測驗</button>
            </div>
        </div>
    </div>

    <!-- 第一階段 -->
    <div id="screen-stage1" class="screen">
        <img id="s1-image" class="bg-image" src="" alt="情境圖">
        
        <div class="glass-panel">
            <h2>第一階段：穿越畫境</h2>
            <div id="stage1-content">
                <div id="s1-story" class="story-text ancient-text"></div>
                <div id="s1-question" class="question-text"></div>
                <div id="s1-options"></div>
            </div>
            <div style="text-align: center;">
                <button id="btn-next-stage2" class="hidden-btn" onclick="goToStage(2)">前往下一關：匠人的案頭</button>
            </div>
        </div>
    </div>

    <!-- 第二階段 -->
    <div id="screen-stage2" class="screen">
        <img src="第二情境-背景圖.jpg" class="bg-image" alt="匠人的案頭背景圖">
        
        <div class="glass-panel" style="width: 85%;">
            <h2>第二階段：匠人的案頭</h2>
            <div id="s2-info" class="story-text ancient-text" style="text-align: center;">畫師的需求不斷傳來，請將正確的工具拖曳至案頭上。</div>
            
            <div id="s2-hint"></div>

            <div id="drag-container" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; min-height: 50px;">
            </div>

            <div id="drop-zone" class="drop-zone">
                請將正確工具拖曳至此處
            </div>

            <div id="s2-result-msg"></div>

            <div style="text-align: center; margin-top: 20px;">
                <button id="btn-next-stage3" class="hidden-btn" onclick="goToStage(3)">前往下一關：點石成金</button>
                <button id="btn-s2-retry" class="hidden-btn" onclick="retryStage2()">重新測驗</button>
            </div>
        </div>
    </div>

    <!-- 第三階段 -->
    <div id="screen-stage3" class="screen">
        <img src="封面圖片.png" class="bg-image" alt="第三階段背景圖">
        
        <div class="glass-panel" style="width: 85%;">
            <h2>第三階段：點石成金</h2>
            <div id="s3-story" class="story-text ancient-text" style="min-height: 60px; text-align: center;">按照正確的順序與技法，賦予畫作生命吧！</div>

            <div id="s3-canvas" class="s3-canvas">
                <img id="s3-image" src="" alt="畫布" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 1;">
                <span id="s3-canvas-text" style="position: relative; z-index: 2; font-weight: bold;">[畫布：空白熟宣紙]</span>
                <div id="s3-canvas-layer" style="position: absolute; top:0; left:0; width:100%; height:100%; background: transparent; transition: all 0.5s ease; z-index: 3;"></div>
            </div>

            <div id="s3-controls" style="text-align: center; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button id="btn-finish" class="hidden-btn" onclick="finishGame()">完成試煉，查看評價</button>
            </div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="screen-result" class="screen">
        <img src="封面圖片.png" class="bg-image" alt="結算背景圖">
        
        <div class="glass-panel small-window" style="max-width: 700px;">
            <h1 class="ancient-title" style="border-bottom: none; margin-bottom: 0;">試煉完成</h1>
            <h2 id="final-title" style="color: #b83326; font-size: 2.2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); margin-top: 10px; margin-bottom: 15px;"></h2>
            <h3 id="final-score-display" style="font-size: 1.5rem; color: #4a3322; margin-bottom: 20px; text-shadow: 0 0 5px rgba(255,255,255,0.8);"></h3>
            
            <div id="final-feedback" class="story-text ancient-text" style="text-align: center; margin-bottom: 15px;"></div>
            
            <div class="story-text ancient-text" style="text-align: center; font-style: italic; margin-top: 25px; padding-top: 20px; border-top: 1px dashed rgba(139, 115, 85, 0.5);">
                「從一根線條到繁花似錦，願這份大愛的微光，能在你手中薪火相傳。」
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="start-btn-premium" onclick="resetGame()" style="font-size: 1.4rem; padding: 10px 35px;">重新體驗</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
